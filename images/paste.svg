<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280" role="img" aria-label="Paste a stopped n8n run, not broken JSON">
  <rect width="640" height="280" fill="#14171e"/>
  <text x="24" y="36" fill="#9a9388" font-family="Avenir Next, Segoe UI, sans-serif" font-size="13">1 · Paste</text>
  <text x="24" y="68" fill="#f2ede4" font-family="Palatino, Georgia, serif" font-size="26">A run that already stopped</text>
  <rect x="24" y="96" width="280" height="140" rx="8" fill="#1c2029" stroke="#2c313c"/>
  <text x="40" y="128" fill="#9a9388" font-family="ui-monospace, monospace" font-size="13">error.message</text>
  <text x="40" y="156" fill="#f2ede4" font-family="ui-monospace, monospace" font-size="14">Authorization failed -</text>
  <text x="40" y="178" fill="#f2ede4" font-family="ui-monospace, monospace" font-size="14">please check your credentials</text>
  <rect x="340" y="96" width="276" height="140" rx="8" fill="#1c2029" stroke="#c45c3a"/>
  <text x="356" y="132" fill="#c45c3a" font-family="Avenir Next, Segoe UI, sans-serif" font-size="16">Not this</text>
  <text x="356" y="164" fill="#f2ede4" font-family="Avenir Next, Segoe UI, sans-serif" font-size="15">Broken JSON</text>
  <text x="356" y="188" fill="#9a9388" font-family="Avenir Next, Segoe UI, sans-serif" font-size="14">Trailing commas, fences,</text>
  <text x="356" y="208" fill="#9a9388" font-family="Avenir Next, Segoe UI, sans-serif" font-size="14">or a file that will not parse</text>
</svg>
